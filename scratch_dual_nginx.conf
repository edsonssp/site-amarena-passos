events {
    worker_connections 1024;
}

http {
    client_max_body_size 50M;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # HTTP -> HTTPS redirect and ACME challenges
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS - Guaxupé
    server {
        listen 443 ssl;
        server_name amarenaguaxupe.com.br www.amarenaguaxupe.com.br chat.amarenaguaxupe.com.br;

        ssl_certificate /etc/letsencrypt/live/amarenaguaxupe.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/amarenaguaxupe.com.br/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://omniflow-app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # HTTPS - Batatais
    server {
        listen 443 ssl;
        server_name amarenabatatais.com.br www.amarenabatatais.com.br chat.amarenabatatais.com.br;

        ssl_certificate /etc/letsencrypt/live/amarenabatatais.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/amarenabatatais.com.br/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://omniflow-app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
